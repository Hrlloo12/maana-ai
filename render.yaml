services:
  - type: web
    name: maana-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""
      - key: LLM_BASE_URL
        value: ""
      - key: EMBEDDING_PROVIDER
        value: local
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
